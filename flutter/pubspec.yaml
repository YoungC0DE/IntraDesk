name: flutter_hbb
description: Your Remote Desktop Software

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
version: 1.5.1+68

environment:
  sdk: '^3.1.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ffi: ^2.1.0
  path_provider: ^2.1.1
  provider: ^6.0.5
  tuple: ^2.0.0
  wakelock_plus: ^1.1.3
  #firebase_analytics: ^9.1.5
  package_info_plus: ^4.2.0
  url_launcher: ^6.3.1
  flutter_breadcrumb: ^1.0.1
  http: ^1.1.0
  image: ^4.0.17
  flutter_rust_bridge: "1.80.1"
  window_manager:
    git:
      url: https://github.com/rustdesk-org/window_manager
      ref: cf4aef0512092fad9344a27ffe1c47ad83269dfc
  desktop_multi_window:
    git:
      url: https://github.com/rustdesk-org/rustdesk_desktop_multi_window
      ref: cddc2e64f8fefce4f80db87b20bcda2dd019bed6
  freezed_annotation: ^2.0.3
  flutter_custom_cursor:
    git:
      url: https://github.com/rustdesk-org/flutter_custom_cursor
      ref: db63b785c38153603e9fb84b50d3ec46f0d7e05e
  window_size:
    git:
      url: https://github.com/21pages/flutter-desktop-embedding.git
      path: plugins/window_size
      ref: 51e67ce047c72b26810b99e8473ddb44612fe356
  get: ^4.6.5
  visibility_detector: ^0.4.0+2
  desktop_drop: ^0.4.4
  scroll_pos: ^0.4.0
  debounce_throttle: ^2.0.0
  file_picker: ^5.1.0
  flutter_svg: ^2.0.5
  uni_links:
    git:
      url: https://github.com/rustdesk-org/uni_links
      path: uni_links
      ref: f416118d843a7e9ed117c7bb7bdc2deda5a9e86f
  uni_links_desktop: ^0.1.6 # use 0.1.6 to make flutter 3.13 works
  path: ^1.8.1
  auto_size_text: ^3.0.0
  bot_toast: ^4.0.3
  win32: any
  password_strength: ^0.2.0
  flutter_launcher_icons: ^0.13.1
  texture_rgba_renderer:
    git:
      url: https://github.com/rustdesk-org/flutter_texture_rgba_renderer
      ref: 42797e0f03141dc2b585f76c64a13974508058b4
  percent_indicator: ^4.2.2
  dropdown_button2: ^2.0.0
  uuid: ^3.0.7
  flex_color_picker: ^3.3.0
  dynamic_layouts:
    git:
      url: https://github.com/rustdesk-org/dynamic_layouts.git
      ref: 24cb88413fa5181d949ddacbb30a65d5c459e7d9
  device_info_plus: ^9.1.0
  extended_text: 14.0.0
  vector_math: ^2.1.4

dev_dependencies:
  icons_launcher: ^2.0.4
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  freezed: ^2.4.2
  flutter_lints: ^2.0.2
  ffigen: ^8.0.2

dependency_overrides:
  intl: ^0.19.0

# rerun: flutter pub run flutter_launcher_icons
flutter_icons:
  image_path: "../res/icon.png"
  android: false
  ios: false
  windows:
    generate: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/

  fonts:
    - family: GestureIcons
      fonts:
        - asset: assets/gestures.ttf
    - family: Tabbar
      fonts:
        - asset: assets/tabbar.ttf
    - family: PeerSearchbar
      fonts:
        - asset: assets/peer_searchbar.ttf
    - family: More
      fonts:
        - asset: assets/more.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
